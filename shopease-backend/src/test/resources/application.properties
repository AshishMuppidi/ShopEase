spring.datasource.url=jdbc:h2:mem:ecommerce_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=test-secret-key-that-is-long-enough-for-tests-and-exceeds-256-bits-minimum
jwt.expiration=900000
jwt.refresh.expiration=604800000

payment.webhook.secret=test-webhook-secret
cors.allowed-origin=http://localhost:3000

dummyjson.enabled=false