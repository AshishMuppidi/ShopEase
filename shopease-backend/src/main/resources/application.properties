spring.application.name=ecommerce

# Database Configuration (MySQL)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Redis Cache
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# JWT Security
jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-secret-key-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Payment Webhook HMAC Secret
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret-change-me}

# CORS Origin
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}

# Optional Seeder
dummyjson.enabled=${DUMMYJSON_ENABLED:false}
dummyjson.products-url=${DUMMYJSON_PRODUCTS_URL:https://dummyjson.com/products?limit=30}
